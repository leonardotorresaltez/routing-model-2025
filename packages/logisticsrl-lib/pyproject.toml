[project]
name = "logisticsrl-lib"
version = "0.1.0"
description = "Lógica compartida"
requires-python = ">=3.10"
dependencies = [
    "gymnasium==1.0.0",
    "tqdm",
    "wandb",
    "scikit-learn"
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.dependencies]
loader-lib = { path = "../loader-lib", develop = true }
common-lib = { path = "../common-lib", develop = true }


